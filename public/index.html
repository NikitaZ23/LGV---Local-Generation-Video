<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LGV - локальная генерация видео</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace">
        <aside class="control-panel">
          <div class="brand-row">
            <div>
              <p class="eyebrow">Локальная генерация видео</p>
              <h1>LGV</h1>
            </div>
            <div id="toolStatus" class="tool-status" aria-live="polite"></div>
          </div>

          <form id="jobForm" class="form-stack">
            <label class="field">
              <span>Видео</span>
              <div class="path-picker">
                <input id="videoPath" name="videoPath" type="text" placeholder="E:\Видео\фильм.mp4" autocomplete="off" required>
                <button id="pickVideoButton" class="ghost-button" type="button" title="Открыть окно выбора видеофайла Windows">Выбрать</button>
              </div>
              <div class="source-actions">
                <button id="openSourceButton" class="mini-button" type="button" disabled>Открыть фильм</button>
                <button id="showSourceButton" class="mini-button" type="button" disabled>Папка фильма</button>
              </div>
            </label>

            <div class="grid-three">
              <label class="field">
                <span>Лучших</span>
                <input id="clipCount" name="clipCount" type="number" min="1" value="5" title="Сколько лучших фрагментов показать и, если включён автоэкспорт, вырезать в MP4. Верхнего ограничения нет.">
              </label>
              <label class="field">
                <span>Макс., мин</span>
                <input id="clipMinutes" name="clipMinutes" type="number" min="1" max="1" step="1" value="1" title="Итоговый MP4 не будет длиннее 1 минуты, чтобы ролик подходил для Shorts.">
              </label>
              <label class="field">
                <span>Запас, сек</span>
                <input id="clipPaddingSeconds" name="clipPaddingSeconds" type="number" min="0" max="15" step="0.5" value="2" title="Сколько секунд добавить перед началом и после конца каждого экспортируемого ролика.">
              </label>
            </div>

            <label class="checkbox-row" title="Строить карту всего фильма по сценам PySceneDetect. Поле лучших не ограничивает выдачу, а итоговые MP4 всё равно режутся до 1 минуты.">
              <input id="analyzeWholeMovie" name="analyzeWholeMovie" type="checkbox" checked>
              <span>Проанализировать весь фильм</span>
            </label>

            <fieldset class="segmented">
              <legend>Режим</legend>
              <label><input type="radio" name="mode" value="balanced" checked><span>Баланс</span></label>
              <label><input type="radio" name="mode" value="action"><span>Экшен</span></label>
              <label><input type="radio" name="mode" value="dialog"><span>Диалог</span></label>
              <label><input type="radio" name="mode" value="emotion"><span>Эмоции</span></label>
              <label><input type="radio" name="mode" value="comedy"><span>Юмор</span></label>
            </fieldset>

            <div class="grid-three">
              <label class="field">
                <span>Язык</span>
                <select id="language" name="language">
                  <option value="auto">Авто</option>
                  <option value="ru">RU</option>
                  <option value="en">EN</option>
                </select>
              </label>
              <label class="field">
                <span>Чувствительность сцен</span>
                <input id="sceneThreshold" name="sceneThreshold" type="number" min="0.15" max="0.75" step="0.05" value="0.35" title="Минимальная чувствительность поиска сцен: ниже значит больше найденных смен, выше значит только резкие переходы. LGV дополнительно подбирает рабочий порог автоматически.">
              </label>
              <label class="field">
                <span>Качество сцен</span>
                <select id="sceneQuality" name="sceneQuality" title="Точнее использует адаптивный детектор и затемнения PySceneDetect. Быстрее использует только основной детектор.">
                  <option value="precise" selected>Точнее</option>
                  <option value="fast">Быстрее</option>
                </select>
              </label>
            </div>

            <div class="toggles">
              <label title="Распознавать речь и учитывать текст при выборе фрагментов"><input id="useWhisper" type="checkbox" checked><span><span class="toggle-name">Whisper</span></span></label>
              <label title="Анализировать кадры через локальную модель OpenCLIP и учитывать визуальный смысл"><input id="useOpenClip" type="checkbox" checked><span><span class="toggle-name">OpenCLIP</span></span></label>
              <label title="Сразу вырезать MP4 после анализа"><input id="autoExport" type="checkbox" checked><span><span class="toggle-name">Автоэкспорт</span></span></label>
              <label title="Кодировать клипы через видеокарту NVIDIA, если доступно"><input id="useNvenc" type="checkbox" checked><span><span class="toggle-name">NVENC</span></span></label>
            </div>

            <button id="startButton" class="primary-button" type="submit">
              <span class="button-icon">▶</span>
              <span>Старт</span>
            </button>
          </form>
        </aside>

        <section class="result-panel">
          <div class="status-strip">
            <div>
              <p class="eyebrow">Задача</p>
              <h2 id="statusTitle">Готово</h2>
            </div>
            <div class="progress-stack">
              <div class="progress-frame" aria-label="progress">
                <div id="progressBar" class="progress-bar"></div>
              </div>
              <div class="progress-meta" aria-live="polite">
                <span id="progressPercent">0%</span>
                <span id="elapsedTime">Прошло: 00:00</span>
                <span id="remainingTime">Осталось: --</span>
                <span id="finishTime">Окончание: --</span>
              </div>
            </div>
          </div>

          <div id="summary" class="summary-line">Выбери локальный видеофайл и запусти анализ.</div>

          <div id="clips" class="clip-list"></div>

          <section class="segment-panel">
            <div class="segment-header">
              <span>Карта фильма</span>
              <span id="segmentCount"></span>
            </div>
            <div id="movieSegments" class="segment-list"></div>
          </section>

          <section class="log-panel">
            <div class="log-header">
              <span>Журнал</span>
              <button id="refreshButton" class="ghost-button" type="button">Обновить</button>
            </div>
            <pre id="logs"></pre>
          </section>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
